<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vue Template</title>
    <!-- Import Styles -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/styles.css" />
    <!-- Import Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="nav-bar"></div>

      <h1>{{ intro }}</h1>

      <h1>{{ name }}</h1>

      <h1 v-for= 'person in listenavne' :key='person.navn'>{{ person.navn }} - {{ person.alder }}</h1>

      <input v-model="name" placeholder="Enter your name" />
      <input v-model="age" placeholder="Enter your age" />
      <button @click="TilføjPerson">Tilføj Person</button>

      <h1 v-for="(item, index) in liste" :key="index">{{ item }}</h1>

      <div v-for="(item, index) in liste" :key="index" v-show="!skjul">
        <h1 v-if="item <= 3" class="alert">{{ item }}</h1>
        <h1 v-else class="normal">{{ item }}</h1>
      </div>

      <div>
        <input v-model="nr" placeholder="indtast tal"/>
        <br>
        <button @click="add">tilføj tal</button>
        <button @click="skjulliste">Skjul liste</button>
      </div>

    </div>

    

    <!-- Import App -->
    <script src="./js/main.js"></script>

    <!-- Mount App -->
    <script>
      const mountedApp = app.mount('#app')
    </script>
  </body>
</html>
